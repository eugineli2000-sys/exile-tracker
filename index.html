function xpNeeded(level){return 100+level*50}function renderSkillsTab(){const root=document.getElementById('tabRoot');root.innerHTML=`<div class="pageHead"><div><h1>⚔️ Навыки</h1><p>Развитие навыков через XP</p></div><button class="btn primary" id="addSkill">+ Навык</button></div><div class="grid">${S.skills.map(s=>{const need=xpNeeded(s.level),p=Math.min(100,s.level>=10?100:s.xp/need*100);return`<div class="skillCard ${s.isCore?'core':''}"><div class="skillTop"><b>${esc(s.name)}</b><span class="lvlTag">LVL ${s.level}</span></div><div class="xpTrack"><div class="xpFill" style="width:${p}%"></div></div><div class="meta" style="margin-top:6px">${s.xp}/${need} XP</div><div class="modalActions"><button class="btn sm primary" data-act="addxp" data-id="${s.id}">+10 XP</button>${!s.isCore?`<button class="btn sm danger" data-act="delSkill" data-id="${s.id}">Удалить</button>`:''}</div></div>`}).join('')}</div>`;document.getElementById('addSkill').onclick=()=>{const name=prompt('Название навыка:');if(name){S.skills.push({id:uid(),name,level:1,xp:0,isCore:false});save('skills');renderAll()}};document.querySelectorAll('[data-act="addxp"]').forEach(x=>x.onclick=()=>{const s=S.skills.find(s=>s.id===x.dataset.id);s.xp+=10;const need=xpNeeded(s.level);if(s.xp>=need&&s.level<10){s.xp-=need;s.level++;toast(`${s.name}: новый уровень ${s.level}!`)}save('skills');renderAll()});document.querySelectorAll('[data-act="delSkill"]').forEach(x=>x.onclick=()=>{S.skills=S.skills.filter(s=>s.id!==x.dataset.id);save('skills');renderAll()})}

function githubConfigSave(){localStorage.setItem(GITHUB_SYNC_KEY,JSON.stringify({repo:githubSync.repo,path:githubSync.path}))}function bytesToBase64(bytes){let s='',chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)s+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(s)}function base64ToBytes(s){const bin=atob(s),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}async function deriveGithubKey(passphrase,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function encryptGithubState(passphrase){if(!passphrase)throw new Error('Нужна фраза шифрования');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveGithubKey(passphrase,salt),plain=new TextEncoder().encode(JSON.stringify({version:1,updatedAt:new Date().toISOString(),state:S})),cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain));return{version:1,alg:'AES-GCM',kdf:'PBKDF2-SHA256',iterations:150000,salt:bytesToBase64(salt),iv:bytesToBase64(iv),data:bytesToBase64(cipher)}}async function decryptGithubState(payload,passphrase){if(!payload||payload.version!==1)throw new Error('Неизвестный формат облачных данных');const key=await deriveGithubKey(passphrase,base64ToBytes(payload.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:base64ToBytes(payload.iv)},key,base64ToBytes(payload.data));return JSON.parse(new TextDecoder().decode(plain))}async function githubApi(path,options={}){if(!githubSync.token)throw new Error('Не указан GitHub token');const r=await fetch('https://api.github.com'+path,{...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+githubSync.token,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}});if(!r.ok){let msg='GitHub API '+r.status;try{const j=await r.json();if(j.message)msg+=': '+j.message}catch(e){}throw new Error(msg)}return r.status===204?null:r.json()}async function githubPull(){const repo=githubSync.repo.trim(),path=githubSync.path.trim();if(!repo||!path||!githubSync.token)throw new Error('Заполни репозиторий, файл и token');const r=await githubApi('/repos/'+repo+'/contents/'+path);return{payload:JSON.parse(new TextDecoder().decode(base64ToBytes(r.content.replace(/\n/g,'')))),sha:r.sha}}async function githubPush(payload,sha){const repo=githubSync.repo.trim(),path=githubSync.path.trim(),content=btoa(unescape(encodeURIComponent(JSON.stringify(payload,null,2)))),body={message:'sync tracker data',content};if(sha)body.sha=sha;return githubApi('/repos/'+repo+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}function githubModal(){openModal(`<h2>☁️ GitHub Sync</h2><p style="font-size:12px;color:var(--text-dim);margin:6px 0 10px">Данные перед отправкой шифруются в браузере AES-256-GCM. В репозитории хранится только зашифрованный файл. Token не сохраняется.</p><label>Репозиторий owner/name</label><input id="gh_repo" value="${esc(githubSync.repo)}" placeholder="eugineli2000-sys/exile-tracker"><label>Файл данных</label><input id="gh_path" value="${esc(githubSync.path)}" placeholder="discipline-data.enc.json"><label>GitHub Fine-grained token</label><input id="gh_token" type="password" placeholder="github_pat_..."><label>Фраза шифрования</label><input id="gh_pass" type="password" placeholder="Одинаковая на всех устройствах"><div class="modalActions"><button class="btn" id="gh_cancel">Отмена</button><button class="btn" id="gh_pull">↓ Скачать</button><button class="btn primary" id="gh_push">↑ Синхронизировать</button></div>`);document.getElementById('gh_cancel').onclick=closeModal;const readForm=()=>{githubSync.repo=document.getElementById('gh_repo').value.trim();githubSync.path=document.getElementById('gh_path').value.trim()||'discipline-data.enc.json';githubSync.token=document.getElementById('gh_token').value.trim();githubConfigSave();return document.getElementById('gh_pass').value};document.getElementById('gh_push').onclick=async()=>{try{const pass=readForm();if(!pass)throw new Error('Укажи фразу шифрования');const enc=await encryptGithubState(pass);let sha=null;try{sha=(await githubPull()).sha}catch(e){if(!String(e.message).includes('404'))throw e}await githubPush(enc,sha);toast('☁️ Данные синхронизированы с GitHub');closeModal()}catch(e){toast('Ошибка GitHub: '+e.message)}};document.getElementById('gh_pull').onclick=async()=>{try{const pass=readForm();if(!pass)throw new Error('Укажи фразу шифрования');const remote=await githubPull(),decoded=await decryptGithubState(remote.payload,pass);if(!decoded.state||typeof decoded.state!=='object')throw new Error('Повреждённые данные');if(!confirm('Заменить текущие данные данными из GitHub?'))return;for(const k of KEYS)if(decoded.state[k]!==undefined)S[k]=decoded.state[k];await saveAll();applyTheme();renderAll();toast('☁️ Данные загружены из GitHub');closeModal()}catch(e){toast('Ошибка GitHub: '+e.message)}}}document.getElementById('githubBtn').addEventListener('click',githubModal);
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme);document.getElementById('themeBtn').textContent=S.theme==='dark'?'🌙':'☀️'}document.getElementById('themeBtn').addEventListener('click',async()=>{S.theme=S.theme==='dark'?'light':'dark';await save('theme');applyTheme()});document.getElementById('folderBtn').addEventListener('click',selectDataFolder);document.getElementById('exportBtn').addEventListener('click',async()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});if(dataDirHandle)try{const fh=await dataDirHandle.getFileHandle(`discipline-backup-${todayStr()}.json`,{create:true}),w=await fh.createWritable();await w.write(blob);await w.close();toast(`Резервная копия сохранена в ${DATA_DIR_NAME}`);return}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`discipline-backup-${todayStr()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Экспорт готов')});document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=async ev=>{try{const data=JSON.parse(ev.target.result);for(const k of KEYS)if(data[k]!==undefined)S[k]=data[k];await saveAll();applyTheme();renderAll();toast('Импорт выполнен')}catch(err){toast('Не удалось прочитать файл')}};reader.readAsText(file);e.target.value=''});document.getElementById('resetBtn').addEventListener('click',async()=>{if(!confirm('Сбросить все данные?'))return;for(const k of KEYS)S[k]=defaultFor(k);await saveAll();applyTheme();renderAll();toast('Данные сброшены')});
loadAll().then(()=>{applyTheme();renderAll()});
</script>
